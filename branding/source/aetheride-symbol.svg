<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="leftBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="rightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="centerCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Container: Rounded squircle with precision gradient stroke -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Background subtle neural/code geometry -->
  <path d="M120 256 L256 120 L392 256 L256 392 Z" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- AetherIDE Cybernetic 'A' Glyph -->
  <!-- Left Wing / Beam -->
  <path d="M 256 96 L 128 384 L 192 384 L 256 224 L 288 304 L 240 304 L 256 264 Z" fill="none" />
  <polygon points="256,96 120,400 184,400 256,236 256,96" fill="url(#leftBeam)" />

  <!-- Right Wing / Beam -->
  <polygon points="256,96 392,400 328,400 256,236 256,96" fill="url(#rightBeam)" />

  <!-- Central Quantum Horizon / Cross-Bridge -->
  <polygon points="196,312 316,312 300,344 212,344" fill="url(#centerCore)" />

  <!-- Core Synthesis Prism / Focal Star -->
  <polygon points="256,192 284,256 256,320 228,256" fill="#F8FAFC" filter="url(#glow)" />

  <!-- Apex Directional Vector Spark -->
  <circle cx="256" cy="96" r="16" fill="#38BDF8" />
  <circle cx="256" cy="96" r="8" fill="#FFFFFF" />
</svg>
