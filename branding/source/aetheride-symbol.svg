<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="outerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070A11" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#28D7F2" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Wing / Beam Gradients -->
    <linearGradient id="cyanBeam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#28D7F2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="violetBeam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#outerGlow)" stroke="url(#squircleBorder)" stroke-width="14" filter="url(#dropShadow)" />
  <rect x="55" y="55" width="914" height="914" rx="217" fill="url(#innerBevel)" />

  <!-- Quantum Lattice Ambient Grid -->
  <g opacity="0.18">
    <circle cx="512" cy="512" r="320" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="512" cy="512" r="220" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="6 8" />
    <polygon points="512,180 800,680 224,680" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="12 12" />
  </g>

  <!-- Ambient Light Reflection Behind Logo -->
  <circle cx="512" cy="460" r="180" fill="#28D7F2" opacity="0.12" filter="url(#hyperGlow)" />
  <circle cx="512" cy="540" r="140" fill="#6366F1" opacity="0.15" filter="url(#hyperGlow)" />

  <!-- Cybernetic 'A' Monogram -->
  <g id="monogram" filter="url(#dropShadow)">
    <!-- Left Wing (Cyan Beam) -->
    <path d="M 512 168
             L 216 776
             L 344 776
             L 512 436
             L 512 168 Z" 
          fill="url(#cyanBeam)" />

    <!-- Left Wing Highlights & Chamfer -->
    <path d="M 512 168
             L 216 776
             L 248 776
             L 512 232 Z" 
          fill="#FFFFFF" opacity="0.25" />

    <!-- Right Wing (Violet Beam) -->
    <path d="M 512 168
             L 808 776
             L 680 776
             L 512 436
             L 512 168 Z" 
          fill="url(#violetBeam)" />

    <!-- Right Wing Specular -->
    <path d="M 512 168
             L 512 232
             L 776 776
             L 808 776 Z" 
          fill="#FFFFFF" opacity="0.18" />

    <!-- Quantum Horizon Cross-Bridge -->
    <polygon points="360,612 664,612 628,668 396,668" fill="url(#bridgeGrad)" opacity="0.95" />
    <polygon points="372,620 652,620 638,642 386,642" fill="#FFFFFF" opacity="0.6" />

    <!-- Core Synthesis Hyper-Diamond -->
    <g filter="url(#hyperGlow)">
      <polygon points="512,380 568,490 512,600 456,490" fill="url(#coreGlowGrad)" />
      <polygon points="512,420 544,490 512,560 480,490" fill="#FFFFFF" />
    </g>

    <!-- Apex Focus Emitter -->
    <circle cx="512" cy="168" r="28" fill="#00F2FE" filter="url(#subtleGlow)" />
    <circle cx="512" cy="168" r="14" fill="#FFFFFF" />
  </g>
</svg>