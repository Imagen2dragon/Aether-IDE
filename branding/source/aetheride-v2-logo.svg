<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" width="1440" height="440">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="iconOuterGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070A11" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="iconSquircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#28D7F2" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="iconInnerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="iconCyanBeam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#28D7F2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="iconVioletBeam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="iconCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="iconBridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="textFrostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="logoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Precision App Icon Mark (320x320) -->
  <g transform="translate(60, 60)" filter="url(#logoDropShadow)">
    <!-- Container -->
    <rect x="0" y="0" width="320" height="320" rx="76" fill="url(#iconOuterGlow)" stroke="url(#iconSquircleBorder)" stroke-width="6" />
    <rect x="3" y="3" width="314" height="314" rx="73" fill="url(#iconInnerBevel)" />

    <!-- Ambient Grid -->
    <g opacity="0.18">
      <circle cx="160" cy="160" r="100" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 6" />
      <circle cx="160" cy="160" r="70" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="3 4" />
    </g>

    <!-- Monogram Shape -->
    <!-- Left Wing -->
    <path d="M 160 52 L 68 242 L 108 242 L 160 136 L 160 52 Z" fill="url(#iconCyanBeam)" />
    <path d="M 160 52 L 68 242 L 78 242 L 160 72 Z" fill="#FFFFFF" opacity="0.3" />

    <!-- Right Wing -->
    <path d="M 160 52 L 252 242 L 212 242 L 160 136 L 160 52 Z" fill="url(#iconVioletBeam)" />
    <path d="M 160 52 L 160 72 L 242 242 L 252 242 Z" fill="#FFFFFF" opacity="0.2" />

    <!-- Bridge -->
    <polygon points="112,192 208,192 196,210 124,210" fill="url(#iconBridgeGrad)" opacity="0.95" />

    <!-- Core Diamond -->
    <g filter="url(#coreGlow)">
      <polygon points="160,118 178,153 160,188 142,153" fill="url(#iconCoreGrad)" />
      <polygon points="160,131 170,153 160,175 150,153" fill="#FFFFFF" />
    </g>

    <!-- Apex Emitter -->
    <circle cx="160" cy="52" r="9" fill="#00F2FE" />
    <circle cx="160" cy="52" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Right: Typography Wordmark & Brand Architecture -->
  <g transform="translate(440, 70)">
    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="124" fill="url(#textFrostGrad)" letter-spacing="-3">
      Aether<tspan fill="#28D7F2">IDE</tspan>
    </text>

    <!-- Beta Version Badge -->
    <g transform="translate(680, 74)">
      <rect x="0" y="0" width="144" height="42" rx="10" fill="url(#badgeGrad)" stroke="#28D7F2" stroke-width="1.8" />
      <text x="72" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#28D7F2" text-anchor="middle" letter-spacing="1.5">v0.1.0-BETA</text>
    </g>

    <!-- Positioning Statement -->
    <text x="4" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" fill="#94A3B8" letter-spacing="3.5">
      AI-NATIVE AUTONOMOUS ENGINEERING ECOSYSTEM
    </text>

    <!-- Technology Sub-pills -->
    <g transform="translate(4, 268)">
      <rect x="0" y="0" width="154" height="28" rx="6" fill="#141824" stroke="#1E293B" stroke-width="1" />
      <text x="77" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#38BDF8" text-anchor="middle" letter-spacing="1">RUST SYSTEMS CORE</text>

      <rect x="166" y="0" width="124" height="28" rx="6" fill="#141824" stroke="#1E293B" stroke-width="1" />
      <text x="228" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#818CF8" text-anchor="middle" letter-spacing="1">TAURI V2 NATIVE</text>

      <rect x="302" y="0" width="160" height="28" rx="6" fill="#141824" stroke="#1E293B" stroke-width="1" />
      <text x="382" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#22C55E" text-anchor="middle" letter-spacing="1">WINDOWS CONPTY</text>

      <rect x="474" y="0" width="152" height="28" rx="6" fill="#141824" stroke="#1E293B" stroke-width="1" />
      <text x="550" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#F59E0B" text-anchor="middle" letter-spacing="1">AI SWARM AGENTS</text>
    </g>
  </g>
</svg>