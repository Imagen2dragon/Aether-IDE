name: AetherIDE Cross-Platform CI

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  code-quality:
    name: Code Formatting & Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust Formatting
        run: |
          cd rust
          cargo fmt --all -- --check

  windows-build:
    name: Windows x64 (MSVC) Build & Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/windows-x64" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Windows Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build Windows Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release
      - name: Build Desktop Workbench
        run: |
          cd apps/desktop
          npm install --ignore-scripts
          npm run build
      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup -y
      - name: Package Windows Release Artifacts
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -SkipBuild
      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherIDE-v0.1.0-beta.2-windows-x64
          path: |
            dist/AetherIDE-Setup-0.1.0-beta.2-x64.exe
            dist/AetherIDE-Setup-0.1.0-beta.2-x64.exe.sha256
            dist/AetherIDE-v0.1.0-beta.2-windows-x64.zip
            dist/AetherIDE-v0.1.0-beta.2-windows-x64.zip.sha256
          if-no-files-found: error

  linux-build:
    name: Linux x64 (GNU) Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/linux-x64" >> $GITHUB_ENV
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup2.4-dev || sudo apt-get install -y libgtk-3-dev libsoup-3.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y dbus-x11 gnome-keyring xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: clippy
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Linux Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Authoritative Linux Tests (D-Bus Session)
        run: |
          cd rust
          dbus-run-session -- cargo test --workspace
      - name: Build Linux Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release
      - name: Build Desktop Workbench
        run: |
          cd apps/desktop
          npm install --ignore-scripts
          npm run build
      - name: Package Linux Release Artifacts
        run: |
          bash scripts/package-linux.sh
      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherIDE-v0.1.0-beta.2-linux-x64
          path: |
            dist/AetherIDE-v0.1.0-beta.2-linux-x64.tar.gz
            dist/AetherIDE-v0.1.0-beta.2-linux-x64.tar.gz.sha256
          if-no-files-found: error

  macos-build:
    name: macOS ARM64 (Apple Silicon) Build & Package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/macos-arm64" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deterministic Headless macOS Keychain
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/aether_ci.keychain-db"
          KEYCHAIN_PASS="ci_test_password"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security show-keychain-info "$KEYCHAIN_PATH"
      - name: Run macOS Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run macOS Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build macOS Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release
      - name: Build Desktop Workbench
        run: |
          cd apps/desktop
          npm install --ignore-scripts
          npm run build
      - name: Package macOS Release Artifacts
        run: |
          bash scripts/package-macos.sh
      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherIDE-v0.1.0-beta.2-macos-arm64
          path: |
            dist/AetherIDE-v0.1.0-beta.2-macos-arm64.tar.gz
            dist/AetherIDE-v0.1.0-beta.2-macos-arm64.tar.gz.sha256
          if-no-files-found: error
      - name: Cleanup macOS Keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/aether_ci.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  frontend-build:
    name: TypeScript & Frontend Workbench Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Desktop Dependencies
        run: |
          cd apps/desktop
          npm install --ignore-scripts
      - name: Build Desktop Workbench
        run: |
          cd apps/desktop
          npm run build
