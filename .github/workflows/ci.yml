name: AetherIDE Cross-Platform CI

on:
  push:
    branches: [ "main", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  code-quality:
    name: Code Formatting & Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust Formatting
        run: |
          cd rust
          cargo fmt --all -- --check

  windows-build:
    name: Windows x64 (MSVC) Build & Test
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/aether-build/windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Run Windows Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build Windows Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release

  linux-build:
    name: Linux x64 (GNU) Build & Test
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/aether-build/linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libsoup2.4-dev libjavascriptcoregtk-4.0-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy
      - name: Run Linux Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Linux Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build Linux Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release

  macos-build:
    name: macOS ARM64 (Apple Silicon) Build & Test
    runs-on: macos-14
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/aether-build/macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - name: Run macOS Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run macOS Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build macOS Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release
