name: AetherIDE Cross-Platform CI

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  code-quality:
    name: Code Formatting & Quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check Rust Formatting
        run: |
          cd rust
          cargo fmt --all -- --check

  windows-build:
    name: Windows x64 (MSVC) Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/windows-x64" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Run Windows Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build Windows Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release

  linux-build:
    name: Linux x64 (GNU) Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/linux-x64" >> $GITHUB_ENV
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup2.4-dev || sudo apt-get install -y libgtk-3-dev libsoup-3.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: clippy
      - name: Run Linux Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Linux Tests
        run: |
          cd rust
          dbus-run-session -- cargo test --workspace || cargo test --workspace
      - name: Build Linux Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release

  macos-build:
    name: macOS ARM64 (Apple Silicon) Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Target Directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/aether-build/macos-arm64" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy
      - name: Run macOS Clippy
        run: |
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Run macOS Tests
        run: |
          cd rust
          cargo test --workspace
      - name: Build macOS Binaries (Release)
        run: |
          cd rust
          cargo build --workspace --release

  frontend-build:
    name: TypeScript & Frontend Workbench Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Desktop Dependencies
        run: |
          cd apps/desktop
          npm install --ignore-scripts
      - name: Build Desktop Workbench
        run: |
          cd apps/desktop
          npm run build
